[project]
name = "optispec"
version = "0.1.1"
description = "Simulate optical spectra with quantum mechanical models."
authors = [{ name = "benkoppe", email = "koppe@arizona.edu" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.31",
    "jaxtyping>=0.2.33",
    "jax-dataclasses>=1.6.1",
    "numpy>=2.0.1",
    "matplotlib>=3.9.2",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.4.31"]
cuda13 = ["jax[cuda13]>=0.7.0"]

[dependency-groups]
dev = ["pytest>=8.3.2"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]

[tool.uv.build-backend]
module-root = ""

[tool.ruff.lint]
# ignore forward annotation errors, they get in the way of jaxtyping
ignore = ["F722"]
